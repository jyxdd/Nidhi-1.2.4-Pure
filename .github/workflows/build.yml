name: Build Kernel (Pure-ThinLTO)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'munch'
        type: choice
        options: [munch, psyche, alioth, pipa] # 縮減選項，確保專注於你測試的設備

jobs:
  build:
    name: Build Kernel for ${{ github.event.inputs.device }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 

    - name: Cleanup & Dependencies
      run: |
        sudo rm -rf /var/lib/docker /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Disable Git SCM version suffix
      run: |
        touch .scmversion
        echo "Created .scmversion to ensure a clean version string"

    - name: Setup Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz -C $HOME/zyc-clang

    - name: Fix Baseband-guard Path
      run: |
        cd ${GITHUB_WORKSPACE}/..
        git clone https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
        cd ${GITHUB_WORKSPACE}
        rm -rf security/baseband-guard
        mkdir -p security
        ln -sf ${GITHUB_WORKSPACE}/../Baseband-guard security/baseband-guard
        echo "✅ Baseband-guard path fixed"

    - name: Prepare AnyKernel3
      run: |
        rm -rf anykernel
        git clone https://github.com/liyafe1997/AnyKernel3.git anykernel

    - name: Build Kernel
      run: |
        export PATH=$HOME/zyc-clang/bin:$PATH
        # 注入 ThinLTO 必備的 LLVM 參數
        export MAKE_ARGS="ARCH=arm64 \
        SUBARCH=arm64 \
        CC=clang \
        LD=ld.lld \
        AR=llvm-ar \
        NM=llvm-nm \
        OBJCOPY=llvm-objcopy \
        OBJDUMP=llvm-objdump \
        STRIP=llvm-strip \
        CROSS_COMPILE=aarch64-linux-gnu- \
        CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
        CLANG_TRIPLE=aarch64-linux-gnu- \
        LLVM=1 \
        LLVM_IAS=1"
        
        chmod +x build.sh
        ./build.sh ${{ github.event.inputs.device }}

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Nidhi-Pure-ThinLTO-${{ github.event.inputs.device }}
        path: out/${{ github.event.inputs.device }}/*.zip
