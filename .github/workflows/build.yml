name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'munch'
        type: choice
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      ksu:
        description: 'Enable KernelSU (SukiSU & SUSFS)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ ( inputs.ksu == true && 'KSU' ) || 'NoKSU' }})
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 獲取完整歷史以支持版本號生成

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Toolchain (ZyC-Clang 15)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz

    # 關鍵步驟：同步守護程序倉庫到上一層目錄，滿足軟連結需求
    - name: Checkout Baseband-guard
      run: |
        cd ..
        git clone https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard

    - name: Build Kernel
      run: |
        chmod +x build.sh
        if [ "${{ inputs.ksu }}" == "true" ]; then
          ./build.sh ${{ inputs.device }} ksu
        else
          ./build.sh ${{ inputs.device }}
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-${{ inputs.device }}-${{ ( inputs.ksu == true && 'KSU' ) || 'NoKSU' }}-${{ github.run_number }}
        path: |
          output/zip/*.zip
          output/logs/*.log
        if-no-files-found: error
