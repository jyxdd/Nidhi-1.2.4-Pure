name: Build Kernel (Pure)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'munch'
        type: choice
        options: [psyche, thyme, umi, munch, lmi, cmi, cas, apollo, alioth, elish, enuma, dagu, pipa]

jobs:
  build:
    name: Build Kernel for ${{ github.event.inputs.device }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 

    - name: Cleanup & Dependencies
      run: |
        # 釋放硬碟空間，防止編譯大核心時溢出
        sudo rm -rf /var/lib/docker /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Disable Git SCM version suffix
      run: |
        # 防止編譯出的內核版本帶有 -dirty 或 git 哈希後綴
        touch .scmversion
        echo "Created .scmversion to ensure a clean version string"

    - name: Setup Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz -C $HOME/zyc-clang

    - name: Fix Baseband-guard Path
      run: |
        # 在工作目錄同級克隆外部安全模組
        cd ${GITHUB_WORKSPACE}/..
        git clone https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
        
        # 回到源碼目錄並建立絕對路徑軟連結
        cd ${GITHUB_WORKSPACE}
        rm -rf security/baseband-guard
        mkdir -p security
        # 指向外部目錄，確保 Kconfig/Makefile 能通過該路徑讀取
        ln -sf ${GITHUB_WORKSPACE}/../Baseband-guard security/baseband-guard
        echo "✅ Baseband-guard path fixed with absolute symlink"

    - name: Prepare AnyKernel3
      run: |
        rm -rf anykernel
        git clone https://github.com/liyafe1997/AnyKernel3.git anykernel
        echo "AnyKernel3 prepared for packaging"

    - name: Build Kernel
      run: |
        chmod +x build.sh
        # 強制傳入設備參數，對接 build.sh 中的 DEVICE=$1
        ./build.sh ${{ github.event.inputs.device }}

    - name: Upload Artifacts
      # 使用 if: always() 確保即便編譯掛了也能拿到 log 排查
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-${{ github.event.inputs.device }}-Pure
        path: |
          output/zip/*.zip
          output/logs/*.log
