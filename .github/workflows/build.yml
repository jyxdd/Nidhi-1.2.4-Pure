name: Build Kernel (Pure)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename'
        required: true
        default: 'munch'
        type: choice
        options: [psyche, thyme, umi, munch, lmi, cmi, cas, apollo, alioth, elish, enuma, dagu, pipa]

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 

    - name: Cleanup & Dependencies
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz -C $HOME/zyc-clang

    - name: Fix Baseband-guard Path
      run: |
        cd ..
        git clone https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
        cd -

    # === 在這裡插入：修復 AnyKernel3 404 問題 ===
    - name: Prepare AnyKernel3
      run: |
        # 刪除倉庫中那個失效的子模組連結/資料夾
        rm -rf anykernel
        # 重新抓取你指定的正確倉庫
        git clone https://github.com/liyafe1997/AnyKernel3.git anykernel
        echo "AnyKernel3 prepared from liyafe1997"

    - name: Build Kernel
      run: |
        chmod +x build.sh
        ./build.sh ${{ inputs.device }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-${{ inputs.device }}-Pure
        path: |
          output/zip/*.zip
          output/logs/*.log
